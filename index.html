<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Erfgo3D – AR viewer</title>

  <!--
    ==========================================================================
    ERFGO3D AR-PROTOTYPE
    ==========================================================================
    Dit is een werkend voorbeeld met de STANDAARD MEEGELEVERDE MindAR-marker
    en een voorbeeldmodel, zodat je meteen kan testen of alles werkt.

    Om dit met je EIGEN marker en 3D-object te gebruiken, hoef je maar twee
    dingen te wijzigen — zoek naar "STAP 1" en "STAP 2" hieronder.

    Vereisten om te testen op je telefoon:
    - Dit bestand moet via HTTPS gehost worden (camera-toegang vereist dit).
      Lokaal testen op je computer via "file://" werkt NIET.
    - Werkt op iOS (Safari) en Android (Chrome) — geen app nodig.
    ==========================================================================
  -->

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --erfgo-dark: #013A3A;
      --erfgo-teal: #007A6E;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    a-scene {
      width: 100%;
      height: 100%;
    }

    /* Instructie-overlay: zichtbaar tot de marker gevonden is */
    #instructions {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      padding: 16px 20px 28px;
      background: linear-gradient(to top, rgba(1,58,58,0.92), rgba(1,58,58,0));
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #instructions .badge {
      display: inline-block;
      background: var(--erfgo-teal);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    /* Laadscherm */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--erfgo-dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    #loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: var(--erfgo-teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>AR-ervaring wordt geladen…</div>
  </div>

  <div id="instructions">
    <div class="badge">Erfgo3D</div>
    <div>Richt de camera op de marker om het object te bekijken.</div>
  </div>

  <!--
    STAP 1 — je eigen marker
    ------------------------
    Vervang de imageTargetSrc hieronder door de URL naar je eigen
    gecompileerde .mind-bestand (gegenereerd via de MindAR target compiler,
    op basis van een foto van je fysieke marker/plaquette op locatie).
    Compiler: https://hiukim.github.io/mind-ar-js-doc/tools/compile

    STAP 2 — je eigen 3D-model
    ---------------------------
    Vervang de gltf-model src bij #ar-object door de URL naar je eigen
    geoptimaliseerde .glb-bestand, en stel positie/rotatie/schaal in
    t.o.v. de marker (0 0 0 = op de marker zelf).
  -->
  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Het model wordt via het script hieronder ingesteld (standaard Testbox_1cm.glb, of ?m=bestandsnaam.glb) -->
      <a-gltf-model
        id="ar-object"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.05 0.05 0.05">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // Laadscherm weghalen zodra de scene klaar is
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('renderstart', () => {
      document.getElementById('loading').style.display = 'none';
    });

    // Kalibratie via URL-parameters, zodat je niet telkens opnieuw hoeft te uploaden.
    // Voorbeeld: https://.../erfgo3d-ar-test/?s=0.01&x=0&y=0&z=0&rx=0&ry=0&rz=0
    //   m  = bestandsnaam van het .glb-model (standaard Testbox_1cm.glb)
    //   s  = schaal (uniform, standaard 0.01)
    //   x, y, z = positie t.o.v. het midden van de marker
    //   rx, ry, rz = rotatie in graden
    // Zonder parameters gelden de standaardwaarden hieronder.
    (function () {
      const p = new URLSearchParams(location.search);
      const n = (key, fallback) => {
        const v = parseFloat(p.get(key));
        return Number.isFinite(v) ? v : fallback;
      };
      const s = n('s', 0.01);
      const obj = document.getElementById('ar-object');
      // Model: standaard Testbox_1cm.glb in dezelfde map, of ?m=ander-bestand.glb
      obj.setAttribute('gltf-model', p.get('m') || 'Testbox_1cm.glb');
      obj.setAttribute('scale', `${s} ${s} ${s}`);
      obj.setAttribute('position', `${n('x', 0)} ${n('y', 0)} ${n('z', 0)}`);
      obj.setAttribute('rotation', `${n('rx', 0)} ${n('ry', 0)} ${n('rz', 0)}`);
    })();

    // Instructie-overlay verbergen zodra de marker gevonden is, terugtonen bij verlies
    sceneEl.addEventListener('targetFound', () => {
      document.getElementById('instructions').style.opacity = '0';
    });
    sceneEl.addEventListener('targetLost', () => {
      document.getElementById('instructions').style.opacity = '1';
    });
  </script>
</body>
</html>
